<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập VIP | EduLang LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="login-card">
    <header class="login-header">
        <div class="brand">
            <div class="brand-icon">E</div>
            <div class="brand-name">EduLang</div>
        </div>
        <h1>Welcome Back</h1>
        <p>Đăng nhập hệ thống vận hành trung tâm ngoại ngữ thông minh tại Nghệ An.</p>
    </header>

    <p>
        <span th:if="${error}" th:text="${error}" style="color:red"></span>
    </p>

    <form th:action="@{/login}" method="post">
        <div class="input-control">
            <input type="text" name="username" placeholder="Tên đăng nhập / Email" required autofocus>
        </div>

        <div class="input-control">
            <input type="password" name="password" placeholder="Mật khẩu" required>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <a href="#" style="color: var(--accent); font-size: 0.8rem; text-decoration: none; font-weight: 600;">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <footer class="login-footer">
        <p>Chưa có tài khoản? <a th:href="@{/register}" style="color: var(--accent); font-weight: 600; text-decoration: none;">Đăng ký ngay</a></p>
        <div style="margin-top: 15px; opacity: 0.5;">
            Bạn là nhân viên? <a href="#" style="color: #fff; text-decoration: underline;">Liên hệ IT Center</a>
        </div>
        <p style="margin-top: 20px; font-size: 0.7rem; opacity: 0.3;">EduLang Premium v2.1 • 2026</p>
    </footer>
</main>

<script>
    const btn = document.querySelector('.btn-submit');

    if (btn) {
      btn.addEventListener('mousedown', () => {
        btn.style.transform = 'translateY(-1px) scale(0.96)';
      });

      btn.addEventListener('mouseup', () => {
        btn.style.transform = '';
      });

      btn.addEventListener('mouseleave', () => {
        btn.style.transform = '';
      });
    }
</script>
</body>
</html>
